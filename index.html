<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rajhans Quick Answer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#173b79;color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:26px}
header p{margin:8px 0 0;color:#e0eaff}
main{max-width:650px;margin:35px auto;padding:20px}
.panel{background:white;padding:24px;border-radius:18px;box-shadow:0 5px 22px #142b4a12}
h2{text-align:center;margin-top:0}
textarea{width:100%;min-height:120px;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;resize:vertical}
button{width:100%;margin-top:12px;padding:14px;background:#2459b3;color:white;border:0;border-radius:10px;font-size:16px;font-weight:bold}
#answer{margin-top:20px;white-space:pre-wrap;line-height:1.6}
footer{text-align:center;color:#68758a;padding:25px;font-size:13px}
</style>
</head>
<body>
<header><h1>Rajhans Quick Answer</h1><p>Apne sawalon ke jawab paayein</p></header>
<main><div class="panel">
<h2>Apna sawal poochhein</h2>
<p>Apna question neeche likhein:</p>
<textarea id="question" placeholder="Jaise: Bharat ki rajdhani kya hai?"></textarea>
<button onclick="answerQuestion()">Jawab dekhein</button>
<div id="answer" role="status"></div>
</div></main>
<footer>© 2026 Rajhans Quick Answer</footer>
<script>
function answerQuestion(){
const q=document.getElementById('question').value.trim();
const a=document.getElementById('answer');
if(!q){a.textContent='Pehle apna sawal likhein.';return;}
a.textContent='Aapka sawal: '+q+'\n\nYeh website ka basic demo hai. Asli AI jawab paane ke liye secure AI service ko connect karna abhi baaki hai.';
}
</script>
</body>
</html>
